<header>
    <nav class="nav">
        <div class="content">
            <div class="nav-left">
                <a class="brand" href="{{ '/' | locale_url | url }}" title="{{ home }}">
                    {{ data.title[lang] or data.title[data.languages[0]] }}
                </a>
            </div>
            <div class="nav-right">
                <div class="tabs">
                    <a href="{{ '/' | locale_url | url }}">{{ home }}</a>
                    <a href="{{ '/about' | locale_url | url }}">{{ about }}</a>
                    {% if lang %}
                    <details class="dropdown">
                        <summary class="button icon-only">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 24 24" width="24"
                                 fill="var(--font-color)">
                                <path d="M11.525 14h4.385l-1.993-4.954L11.525 14zm5.19 2h-6.156l-1.658 3.435a1 1 0 0 1-1.802-.87l5.017-10.388a2 2 0 0 1
                    3.656.123l4.156 10.327a1 1 0 0 1-1.856.746L16.715 16zM1 0h8a1 1 0 1 1 0 2H1a1 1 0 1 1 0-2zm0 5a1 1 0 1 1 0-2h7.003a2 2 0
                    0 1 1.736 2.992c-.945 1.654-1.993 2.844-3.165 3.554-1.472.893-3.32 1.372-5.537 1.453a1 1 0 1 1-.074-1.998c1.898-.07
                    3.419-.464 4.574-1.165C6.384 7.323 7.213 6.382 8.003 5H1z"></path>
                            </svg>
                        </summary>
                        <div class="card" typeof="WebPage" resource="{{ page.url | locale_url | url }}#this">
                            <span hidden property="name">{{ data.title[lang] }}</span>
                            <span class="is-center text-success" property="inLanguage" typeof="Language" {% if
                                  data.languageUris[lang] %}resource="{{ data.languageUris[lang] }}" {% endif %}>
                                <span hidden property="alternateName">{{ lang }}</span>
                                <span property="name">{{ data.languageLabels[lang] }}</span>
                            </span>
                            {% for link in page.url | locale_links %}
                            <span property="inLanguage" typeof="Language" {% if data.languageUris[lang]
                                  %}resource="{{ data.languageUris[link.lang] }}" {% endif %}>
                                <span hidden property="alternateName" xml:lang="{{ link.lang }}"
                                      lang="{{ link.lang }}">{{ link.lang }}</span>
                                <a href="{{ link.url | url }}" property="url">
                                    <span property="name" xml:lang="{{ link.lang }}" lang="{{ link.lang }}">{{
                                        data.languageLabels[link.lang] }}</span>
                                </a>
                            </span>
                            {% endfor %}
                        </div>
                    </details>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>
</header>
